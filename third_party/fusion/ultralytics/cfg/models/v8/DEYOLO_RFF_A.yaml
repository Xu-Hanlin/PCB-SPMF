# Ultralytics YOLO 🚀, AGPL-3.0 license
# DEYOLO + RFF_Lite (Safe) + DEA (Residual-Gated, Route A: use MSI mainly at P5)

nc: 3
scales:
  n: [0.33, 0.25, 1024]

# =========================
# Backbone 1: RGB
# =========================
backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1 P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3 P3/8
  - [-1, 6, C2f, [256, True]]              # 4 P3/8
  - [-1, 1, Conv, [512, 3, 2]]             # 5 P4/16
  - [-1, 6, C2f, [512, True]]              # 6 P4/16
  - [-1, 1, Conv, [1024, 3, 2]]            # 7 P5/32
  - [-1, 3, C2f, [1024, True]]             # 8 P5/32
  - [-1, 1, SPPF, [1024, 5]]               # 9

# =========================
# Backbone 2: MSI/HSI
# =========================
backbone2:
  - [-1, 1, Conv, [64, 3, 2]]              # 10 P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 11 P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]      # 12
  - [-1, 1, Conv, [256, 3, 2]]             # 13 P3/8
  - [-1, 6, C2f, [256, True]]              # 14 P3/8
  - [-1, 1, Conv, [512, 3, 2]]             # 15 P4/16
  - [-1, 6, C2f, [512, True]]              # 16 P4/16
  - [-1, 1, Conv, [1024, 3, 2]]            # 17 P5/32
  - [-1, 3, C2f, [1024, True]]             # 18 P5/32
  - [-1, 1, SPPF, [1024, 5]]               # 19

# =========================
# Head
# =========================
head:
  # RFF_Lite: [RGB_P1(0), HSI_P1(10), RGB_P3(4)] -> enhanced RGB_P3
  - [[0, 10, 4], 1, RFF_Lite, [64, 256]]   # 20

  # ---------------------------------------------------------
  # DEA (Residual-Gated) - Route A
  # 目标：MSI/HSI 主要在 P5 发挥；P3 几乎不让 MSI 进来（防错位伤 connector）
  #
  # DEA 参数顺序（对应你那版 DEA.py）：
  # [channel, kernel_size, p_kernel, m_kernel, reduction, g_max, alpha_init, per_channel, use_gate]
  # ---------------------------------------------------------

  # P3: 极保守（几乎不用 MSI，保护 connector）
  - [[20, 14], 1, DEA, [256, 80, null, null, 16, 0.02, -6.0, True, True]]   # 21 P3 fused

  # P4: 保守（给 MSI 一点梯度，但不让它主导）
  - [[6, 16],  1, DEA, [512, 40, null, null, 16, 0.15, -3.0, True, True]]   # 22 P4 fused

  # P5: 开门（让 MSI 在高层语义/材质层面发挥）
  - [[9, 19],  1, DEA, [1024,20, null, null, 16, 0.50, -2.0, True, True]]   # 23 P5 fused

  # FPN/PAN
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 24
  - [[-1, 22], 1, Concat, [1]]                   # 25
  - [-1, 3, C2f, [512]]                          # 26

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 27
  - [[-1, 21], 1, Concat, [1]]                   # 28
  - [-1, 3, C2f, [256]]                          # 29

  - [-1, 1, Conv, [256, 3, 2]]                   # 30
  - [[-1, 26], 1, Concat, [1]]                   # 31
  - [-1, 3, C2f, [512]]                          # 32

  - [-1, 1, Conv, [512, 3, 2]]                   # 33
  - [[-1, 23], 1, Concat, [1]]                   # 34
  - [-1, 3, C2f, [1024]]                         # 35

  - [[29, 32, 35], 1, Detect, [nc]]              # 36
