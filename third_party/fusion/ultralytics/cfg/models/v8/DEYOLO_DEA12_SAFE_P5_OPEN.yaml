# Ultralytics YOLOv8 dual-backbone with SAFE P5-only DEA_12 fusion (opened-gate version)
# Same topology as user's proven SAFE P5-only model. Only DEA args are changed.

nc: 3
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

backbone2:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  # DEA_12 args:
  # [channel, kernel_size, p_kernel, m_kernel, reduction, g_max, alpha_init, per_channel, use_gate,
  #  dropout, beta_init, bypass_eps_gate, bypass_eps_msi,
  #  reliability, rel_reduction, rel_init, force_steps, force_r,
  #  warp, warp_max_shift, warp_align_corners, warp_init, warp_learnable,
  #  spatial_select, sp_reduction, sp_init, sp_floor]
  # Opened-gate design:
  # - alpha_init=-2.2  -> sigmoid ~= 0.100
  # - beta_init=-2.0   -> sigmoid ~= 0.119
  # - dropout=0.0      -> do not randomly kill DEA in early training
  # - rel_init=0.0     -> reliability starts near 0.5 instead of being suppressed
  # - force_r=0.70     -> keep residual mix from collapsing at the beginning
  # - spatial gate floor=0.10 -> allow local correction but still conservative
  - [[9, 19], 1, DEA, [1024, 20, null, null, 16, 0.50, -2.2, True, True, 0.00, -2.0, 1e-5, 1e-8,
                       True, 32, 0.0, 3000, 0.70,
                       True, 1.5, False, 0.0, True,
                       True, 16, -0.8, 0.10]]

  - [9, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[26, 29, 32], 1, Detect, [nc]]
