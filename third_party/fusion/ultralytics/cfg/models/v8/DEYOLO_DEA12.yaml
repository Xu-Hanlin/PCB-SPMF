# Ultralytics YOLOv8 dual-backbone PCB model with DEA_12 selective safe fusion

nc: 3
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

backbone2:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f_BiFocus, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  # P3: strongest multimodal correction, because PCB tiny defects usually live here
  - [[4, 14], 1, DEA, [256, 80, ~, ~, 16, 1.0, -2.2, True, True, 0.0, -2.2, 0.00001, 0.00000001, True, 32, -0.2, 3000, 0.75, True, 2.0, False, 0.0, True, True, 16, -0.2, 0.20]]
  # P4: moderate correction
  - [[6, 16], 1, DEA, [512, 40, ~, ~, 16, 1.0, -2.6, True, True, 0.0, -2.6, 0.00001, 0.00000001, True, 32, -0.4, 3000, 0.65, True, 1.5, False, 0.0, True, True, 16, -0.4, 0.15]]
  # P5: keep very conservative to avoid high-level semantic pollution
  - [[9, 19], 1, DEA, [1024, 20, ~, ~, 16, 1.0, -3.4, True, True, 0.0, -3.4, 0.00001, 0.00000001, True, 32, -0.8, 2000, 0.45, True, 1.0, False, 0.0, True, True, 16, -0.8, 0.08]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 20], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 22], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[28, 31, 34], 1, Detect, [nc]]
