# Ultralytics YOLOv8 dual-backbone with SAFE P3+P4+P5 DEA fusion
# - RGB backbone + head kept aligned with single-modal YOLO for reliable weight transfer
# - MSI backbone is parallel and injected at P3, P4, and P5 via DEA

nc: 3
scales:
  n: [0.33, 0.25, 1024]

# -------------------------
# Backbone 1: RGB
# -------------------------
backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0
  - [-1, 1, Conv, [128, 3, 2]]       # 1
  - [-1, 3, C2f, [128, True]]        # 2
  - [-1, 1, Conv, [256, 3, 2]]       # 3
  - [-1, 6, C2f, [256, True]]        # 4 (P3 RGB)
  - [-1, 1, Conv, [512, 3, 2]]       # 5
  - [-1, 6, C2f, [512, True]]        # 6 (P4 RGB)
  - [-1, 1, Conv, [1024, 3, 2]]      # 7
  - [-1, 3, C2f, [1024, True]]       # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9 (P5 RGB)

# -------------------------
# Backbone 2: MSI/HSI
# -------------------------
backbone2:
  - [-1, 1, Conv, [64, 3, 2]]        # 10
  - [-1, 1, Conv, [128, 3, 2]]       # 11
  - [-1, 3, C2f, [128, True]]        # 12
  - [-1, 1, Conv, [256, 3, 2]]       # 13
  - [-1, 6, C2f, [256, True]]        # 14 (P3 MSI)
  - [-1, 1, Conv, [512, 3, 2]]       # 15
  - [-1, 6, C2f, [512, True]]        # 16 (P4 MSI)
  - [-1, 1, Conv, [1024, 3, 2]]      # 17
  - [-1, 3, C2f, [1024, True]]       # 18
  - [-1, 1, SPPF, [1024, 5]]         # 19 (P5 MSI)

# -------------------------
# Head
# -------------------------
head:
  # P3, P4 and P5 SAFE fusion
  - [[4, 14], 1, DEA, [256, 20, null, null, 16, 0.50, -2.2, True, True, 0.00, -2.0, 1e-5, 1e-8]]    # 20 (P3 fused)
  - [[6, 16], 1, DEA, [512, 20, null, null, 16, 0.50, -2.2, True, True, 0.00, -2.0, 1e-5, 1e-8]]    # 21 (P4 fused)
  - [[9, 19], 1, DEA, [1024, 20, null, null, 16, 0.50, -2.2, True, True, 0.00, -2.0, 1e-5, 1e-8]]   # 22 (P5 fused)

  - [22, 1, nn.Upsample, [None, 2, "nearest"]]         # 23 (use fused P5)
  - [[-1, 21], 1, Concat, [1]]                         # 24 (use fused P4)
  - [-1, 3, C2f, [512]]                                # 25 (P4 neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 26
  - [[-1, 20], 1, Concat, [1]]                         # 27 (use fused P3)
  - [-1, 3, C2f, [256]]                                # 28 (P3)

  - [-1, 1, Conv, [256, 3, 2]]                         # 29
  - [[-1, 25], 1, Concat, [1]]                         # 30
  - [-1, 3, C2f, [512]]                                # 31 (P4)

  - [-1, 1, Conv, [512, 3, 2]]                         # 32
  - [[-1, 22], 1, Concat, [1]]                         # 33 (use fused P5)
  - [-1, 3, C2f, [1024]]                               # 34 (P5)

  - [[28, 31, 34], 1, Detect, [nc]]                    # 35