# Ultralytics YOLO ??, AGPL-3.0 license
# DEYOLO (RGBSame) + ONLY ONE FUSION (DEA@P5). Remove RFF, keep P3/P4 pure RGB to preserve baseline.

nc: 3
scales:
  n: [0.33, 0.25, 1024]

# =========================
# Backbone 1: RGB  (STRICTLY SAME AS YOLOv8n)
# =========================
backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1 P2/4
  - [-1, 3, C2f, [128, True]]              # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3 P3/8
  - [-1, 6, C2f, [256, True]]              # 4 P3/8   (RGB P3)
  - [-1, 1, Conv, [512, 3, 2]]             # 5 P4/16
  - [-1, 6, C2f, [512, True]]              # 6 P4/16  (RGB P4)
  - [-1, 1, Conv, [1024, 3, 2]]            # 7 P5/32
  - [-1, 3, C2f, [1024, True]]             # 8 P5/32
  - [-1, 1, SPPF, [1024, 5]]               # 9        (RGB P5)

# =========================
# Backbone 2: MSI/HSI  (keep your current MSI backbone)
# =========================
backbone2:
  - [-1, 1, Conv, [64, 3, 2]]              # 10 P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 11 P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]      # 12
  - [-1, 1, Conv, [256, 3, 2]]             # 13 P3/8
  - [-1, 6, C2f, [256, True]]              # 14 P3/8
  - [-1, 1, Conv, [512, 3, 2]]             # 15 P4/16
  - [-1, 6, C2f, [512, True]]              # 16 P4/16
  - [-1, 1, Conv, [1024, 3, 2]]            # 17 P5/32
  - [-1, 3, C2f, [1024, True]]             # 18 P5/32
  - [-1, 1, SPPF, [1024, 5]]               # 19       (MSI P5)

# =========================
# Head: follow YOLOv8 head, but P5 uses DEA-fused feature; P3/P4 are pure RGB
# =========================
head:
  # DEA at P5 only: fuse [RGB_P5(9), MSI_P5(19)] -> fused_P5
  # args: [channel, kernel_size, p_kernel, m_kernel, reduction, g_max, alpha_init, per_channel, use_gate]
  - [[9, 19], 1, DEA, [1024, 20, null, null, 16, 0.30, -2.0, True, True]]  # 20 fused P5

  # YOLOv8 head (start from fused P5)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 21
  - [[-1, 6], 1, Concat, [1]]                   # 22 cat RGB P4
  - [-1, 3, C2f, [512]]                         # 23

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 24
  - [[-1, 4], 1, Concat, [1]]                   # 25 cat RGB P3
  - [-1, 3, C2f, [256]]                         # 26 (P3/8 small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 27
  - [[-1, 23], 1, Concat, [1]]                  # 28 cat head P4
  - [-1, 3, C2f, [512]]                         # 29 (P4/16 medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 30
  - [[-1, 20], 1, Concat, [1]]                  # 31 cat fused P5
  - [-1, 3, C2f, [1024]]                        # 32 (P5/32 large)

  - [[26, 29, 32], 1, Detect, [nc]]             # 33
